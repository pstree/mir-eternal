name: Client Editor Build

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: '要上传产物的 Release Tag'
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        targets: [win-x86,win-x64]

    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Build Applications
      run: dotnet publish -c release -r $env:Target -o ./publish/$env:Target Mir3DEditor/Mir3DClientEditor
      env:
        Target: ${{ matrix.targets }}

    - name: Package
      run: Compress-Archive -Path ./publish/${{ matrix.targets }}/* -DestinationPath ./Client-Editor-${{ matrix.targets }}.zip

    - name: Upload to release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.tag || github.ref_name }}
        files: ./Client-Editor-${{ matrix.targets }}.zip
